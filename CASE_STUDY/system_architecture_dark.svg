  <rect x="61" y="378" width="210" height="52" rx="8" fill="#633806" stroke="#BA7517" stroke-width="0.5"/>
  <text x="166" y="398" font-size="13" font-weight="bold" fill="#FAC775" text-anchor="middle" dominant-baseline="central">TLS encryption</text>
  <text x="166" y="416" font-size="11" fill="#EF9F27" text-anchor="middle" dominant-baseline="central">MQTT port 8883</text>

  <rect x="295" y="378" width="210" height="52" rx="8" fill="#633806" stroke="#BA7517" stroke-width="0.5"/>
  <text x="400" y="398" font-size="13" font-weight="bold" fill="#FAC775" text-anchor="middle" dominant-baseline="central">Device authentication</text>
  <text x="400" y="416" font-size="11" fill="#EF9F27" text-anchor="middle" dominant-baseline="central">SAS key / X.509 cert</text>

  <rect x="529" y="378" width="210" height="52" rx="8" fill="#633806" stroke="#BA7517" stroke-width="0.5"/>
  <text x="634" y="398" font-size="13" font-weight="bold" fill="#FAC775" text-anchor="middle" dominant-baseline="central">Threat simulation</text>
  <text x="634" y="416" font-size="11" fill="#EF9F27" text-anchor="middle" dominant-baseline="central">Rejected device demo</text>

  <line x1="400" y1="458" x2="400" y2="484" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="474" font-size="11" fill="#666" dominant-baseline="central">Authenticated messages</text>

