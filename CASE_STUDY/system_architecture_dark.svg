  <text x="166" y="236" font-size="13" font-weight="bold" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">Sensor reader</text>
  <text x="166" y="254" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">GPIO polling loop</text>
  <text x="166" y="270" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">sensor_reader.py</text>

  <rect x="295" y="212" width="210" height="72" rx="8" fill="#0C447C" stroke="#378ADD" stroke-width="0.5"/>
  <text x="400" y="236" font-size="13" font-weight="bold" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">Alert engine</text>
  <text x="400" y="254" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">Inactivity + thresholds</text>
  <text x="400" y="270" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">alert_engine.py</text>

