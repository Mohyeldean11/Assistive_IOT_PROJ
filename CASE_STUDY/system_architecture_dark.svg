<svg width="800" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <rect width="800" height="900" fill="#0f1117"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- LAYER 1: Sensor layer — dark teal -->
  <rect x="40" y="28" width="720" height="118" rx="14" fill="#04342C" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="60" y="52" font-size="13" font-weight="bold" fill="#5DCAA5" dominant-baseline="central">Sensor layer</text>

  <rect x="60" y="64" width="156" height="52" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="138" y="86" font-size="13" font-weight="bold" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">PIR sensor</text>
  <text x="138" y="104" font-size="11" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">HC-SR501</text>

  <rect x="232" y="64" width="156" height="52" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="310" y="86" font-size="13" font-weight="bold" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">Emergency button</text>
  <text x="310" y="104" font-size="11" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">Push button module</text>

  <rect x="404" y="64" width="156" height="52" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="482" y="86" font-size="13" font-weight="bold" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">DHT22 sensor</text>
  <text x="482" y="104" font-size="11" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">Temp / humidity</text>

  <rect x="576" y="64" width="156" height="52" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="654" y="86" font-size="13" font-weight="bold" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">Camera module</text>
  <text x="654" y="104" font-size="11" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">Pi Camera v2</text>

  <line x1="400" y1="146" x2="400" y2="174" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="163" font-size="11" fill="#666" dominant-baseline="central">GPIO reads</text>

