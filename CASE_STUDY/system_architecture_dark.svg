  <rect x="436" y="808" width="12" height="12" rx="2" fill="#712B13" stroke="#D85A30" stroke-width="0.5"/>
  <text x="454" y="819" font-size="11" fill="#666" dominant-baseline="central">Application</text>

  <!-- Caption -->
  <text x="400" y="858" font-size="11" fill="#444" text-anchor="middle">Figure 1 — Cloud-based secure assistive monitoring system: high-level architecture</text>

