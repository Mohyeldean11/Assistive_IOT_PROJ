  <rect x="61" y="686" width="210" height="72" rx="8" fill="#712B13" stroke="#D85A30" stroke-width="0.5"/>
  <text x="166" y="710" font-size="13" font-weight="bold" fill="#F5C4B3" text-anchor="middle" dominant-baseline="central">Streamlit dashboard</text>
  <text x="166" y="728" font-size="11" fill="#F0997B" text-anchor="middle" dominant-baseline="central">Live caregiver view</text>
  <text x="166" y="744" font-size="11" fill="#F0997B" text-anchor="middle" dominant-baseline="central">dashboard.py</text>

  <rect x="295" y="686" width="210" height="72" rx="8" fill="#712B13" stroke="#D85A30" stroke-width="0.5"/>
  <text x="400" y="710" font-size="13" font-weight="bold" fill="#F5C4B3" text-anchor="middle" dominant-baseline="central">Access control</text>
  <text x="400" y="728" font-size="11" fill="#F0997B" text-anchor="middle" dominant-baseline="central">Login-gated UI</text>
  <text x="400" y="744" font-size="11" fill="#F0997B" text-anchor="middle" dominant-baseline="central">RBAC / Azure AD</text>

  <rect x="529" y="686" width="210" height="72" rx="8" fill="#712B13" stroke="#D85A30" stroke-width="0.5"/>
  <text x="634" y="710" font-size="13" font-weight="bold" fill="#F5C4B3" text-anchor="middle" dominant-baseline="central">Notifications</text>
  <text x="634" y="728" font-size="11" fill="#F0997B" text-anchor="middle" dominant-baseline="central">Email / Teams alert</text>
  <text x="634" y="744" font-size="11" fill="#F0997B" text-anchor="middle" dominant-baseline="central">Caregiver output</text>

  <!-- Legend -->
  <rect x="60" y="808" width="12" height="12" rx="2" fill="#085041" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="78" y="819" font-size="11" fill="#666" dominant-baseline="central">Sensor layer</text>

  <rect x="172" y="808" width="12" height="12" rx="2" fill="#0C447C" stroke="#378ADD" stroke-width="0.5"/>
  <text x="190" y="819" font-size="11" fill="#666" dominant-baseline="central">Embedded</text>

  <rect x="272" y="808" width="12" height="12" rx="2" fill="#633806" stroke="#BA7517" stroke-width="0.5"/>
  <text x="290" y="819" font-size="11" fill="#666" dominant-baseline="central">Security</text>

  <rect x="364" y="808" width="12" height="12" rx="2" fill="#3C3489" stroke="#7F77DD" stroke-width="0.5"/>
