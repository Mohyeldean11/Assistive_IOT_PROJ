  <text x="60" y="510" font-size="13" font-weight="bold" fill="#AFA9EC" dominant-baseline="central">Cloud layer — Microsoft Azure</text>

  <rect x="61" y="522" width="210" height="72" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="166" y="546" font-size="13" font-weight="bold" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">Azure IoT Hub</text>
  <text x="166" y="564" font-size="11" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">Device gateway</text>
  <text x="166" y="580" font-size="11" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">Free F1 tier</text>

  <rect x="295" y="522" width="210" height="72" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="400" y="546" font-size="13" font-weight="bold" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">Azure Table Storage</text>
  <text x="400" y="564" font-size="11" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">Telemetry log</text>
  <text x="400" y="580" font-size="11" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">storage_writer.py</text>

  <rect x="529" y="522" width="210" height="72" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="634" y="546" font-size="13" font-weight="bold" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">Logic Apps / Function</text>
  <text x="634" y="564" font-size="11" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">Alert trigger</text>
  <text x="634" y="580" font-size="11" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">alert_notifier.py</text>

  <line x1="400" y1="622" x2="400" y2="648" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="638" font-size="11" fill="#666" dominant-baseline="central">REST API pull</text>

