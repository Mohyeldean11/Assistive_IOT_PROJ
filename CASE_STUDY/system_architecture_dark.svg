  <text x="634" y="254" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">JSON payload + send</text>
  <text x="634" y="270" font-size="11" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">azure_client.py</text>

  <line x1="400" y1="312" x2="400" y2="338" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="328" font-size="11" fill="#666" dominant-baseline="central">MQTT over TLS</text>

