<svg width="800" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="800" height="900" fill="#ffffff"/>

  <!-- ── Color palette (hardcoded for PDF/print) ── -->
  <!-- Teal: fill #E1F5EE stroke #0F6E56 text #085041 -->
  <!-- Blue: fill #E6F1FB stroke #185FA5 text #0C447C -->
  <!-- Amber: fill #FAEEDA stroke #854F0B text #633806 -->
  <!-- Purple: fill #EEEDFE stroke #534AB7 text #3C3489 -->
  <!-- Coral: fill #FAECE7 stroke #993C1D text #712B13 -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ══ LAYER 1: Sensor layer ══ -->
  <rect x="40" y="28" width="720" height="118" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="60" y="52" font-size="13" font-weight="bold" fill="#085041">Sensor layer</text>

  <!-- Sensor boxes: 4 × 156px wide, gap 16, start x=60 -->
  <rect x="60" y="64" width="156" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="138" y="86" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">PIR sensor</text>
  <text x="138" y="104" font-size="11" fill="#0F6E56" text-anchor="middle">HC-SR501</text>

  <rect x="232" y="64" width="156" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="310" y="86" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Emergency button</text>
  <text x="310" y="104" font-size="11" fill="#0F6E56" text-anchor="middle">Push button module</text>

  <rect x="404" y="64" width="156" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="482" y="86" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">DHT22 sensor</text>
  <text x="482" y="104" font-size="11" fill="#0F6E56" text-anchor="middle">Temp / humidity</text>

  <rect x="576" y="64" width="156" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="654" y="86" font-size="13" font-weight="bold" fill="#085041" text-anchor="middle">Camera module</text>
  <text x="654" y="104" font-size="11" fill="#0F6E56" text-anchor="middle">Pi Camera v2</text>

  <!-- Connector + label -->
  <line x1="400" y1="146" x2="400" y2="174" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="163" font-size="11" fill="#5F5E5A">GPIO reads</text>

  <!-- ══ LAYER 2: Embedded layer ══ -->
  <rect x="40" y="176" width="720" height="136" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="60" y="200" font-size="13" font-weight="bold" fill="#0C447C">Embedded processing layer — Raspberry Pi 4</text>

  <!-- 3 blue boxes: 210px wide, gap 18, start x=61 -->
  <rect x="61" y="212" width="210" height="72" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="166" y="236" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">Sensor reader</text>
  <text x="166" y="254" font-size="11" fill="#185FA5" text-anchor="middle">GPIO polling loop</text>
  <text x="166" y="270" font-size="11" fill="#185FA5" text-anchor="middle">sensor_reader.py</text>

  <rect x="295" y="212" width="210" height="72" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="400" y="236" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">Alert engine</text>
  <text x="400" y="254" font-size="11" fill="#185FA5" text-anchor="middle">Inactivity + thresholds</text>
  <text x="400" y="270" font-size="11" fill="#185FA5" text-anchor="middle">alert_engine.py</text>

  <rect x="529" y="212" width="210" height="72" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="634" y="236" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">Azure IoT client</text>
  <text x="634" y="254" font-size="11" fill="#185FA5" text-anchor="middle">JSON payload + send</text>
  <text x="634" y="270" font-size="11" fill="#185FA5" text-anchor="middle">azure_client.py</text>

  <!-- Connector -->
  <line x1="400" y1="312" x2="400" y2="338" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="328" font-size="11" fill="#5F5E5A">MQTT over TLS</text>

  <!-- ══ LAYER 3: Security layer ══ -->
  <rect x="40" y="340" width="720" height="118" rx="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="60" y="364" font-size="13" font-weight="bold" fill="#633806">Secure communication layer</text>

  <rect x="61" y="378" width="210" height="52" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="166" y="398" font-size="13" font-weight="bold" fill="#633806" text-anchor="middle">TLS encryption</text>
  <text x="166" y="416" font-size="11" fill="#854F0B" text-anchor="middle">MQTT port 8883</text>

  <rect x="295" y="378" width="210" height="52" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="400" y="398" font-size="13" font-weight="bold" fill="#633806" text-anchor="middle">Device authentication</text>
  <text x="400" y="416" font-size="11" fill="#854F0B" text-anchor="middle">SAS key / X.509 cert</text>

  <rect x="529" y="378" width="210" height="52" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="634" y="398" font-size="13" font-weight="bold" fill="#633806" text-anchor="middle">Threat simulation</text>
  <text x="634" y="416" font-size="11" fill="#854F0B" text-anchor="middle">Rejected device demo</text>

  <!-- Connector -->
  <line x1="400" y1="458" x2="400" y2="484" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="474" font-size="11" fill="#5F5E5A">Authenticated messages</text>

  <!-- ══ LAYER 4: Cloud layer ══ -->
  <rect x="40" y="486" width="720" height="136" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="60" y="510" font-size="13" font-weight="bold" fill="#3C3489">Cloud layer — Microsoft Azure</text>

  <rect x="61" y="522" width="210" height="72" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="166" y="546" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Azure IoT Hub</text>
  <text x="166" y="564" font-size="11" fill="#534AB7" text-anchor="middle">Device gateway</text>
  <text x="166" y="580" font-size="11" fill="#534AB7" text-anchor="middle">Free F1 tier</text>

  <rect x="295" y="522" width="210" height="72" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="400" y="546" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Azure Table Storage</text>
  <text x="400" y="564" font-size="11" fill="#534AB7" text-anchor="middle">Telemetry log</text>
  <text x="400" y="580" font-size="11" fill="#534AB7" text-anchor="middle">storage_writer.py</text>

  <rect x="529" y="522" width="210" height="72" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="634" y="546" font-size="13" font-weight="bold" fill="#3C3489" text-anchor="middle">Logic Apps / Function</text>
  <text x="634" y="564" font-size="11" fill="#534AB7" text-anchor="middle">Alert trigger</text>
  <text x="634" y="580" font-size="11" fill="#534AB7" text-anchor="middle">alert_notifier.py</text>

  <!-- Connector -->
  <line x1="400" y1="622" x2="400" y2="648" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="412" y="638" font-size="11" fill="#5F5E5A">REST API pull</text>

  <!-- ══ LAYER 5: Application layer ══ -->
  <rect x="40" y="650" width="720" height="136" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="60" y="674" font-size="13" font-weight="bold" fill="#712B13">Application layer</text>

  <rect x="61" y="686" width="210" height="72" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="166" y="710" font-size="13" font-weight="bold" fill="#712B13" text-anchor="middle">Streamlit dashboard</text>
  <text x="166" y="728" font-size="11" fill="#993C1D" text-anchor="middle">Live caregiver view</text>
  <text x="166" y="744" font-size="11" fill="#993C1D" text-anchor="middle">dashboard.py</text>

  <rect x="295" y="686" width="210" height="72" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="400" y="710" font-size="13" font-weight="bold" fill="#712B13" text-anchor="middle">Access control</text>
  <text x="400" y="728" font-size="11" fill="#993C1D" text-anchor="middle">Login-gated UI</text>
  <text x="400" y="744" font-size="11" fill="#993C1D" text-anchor="middle">RBAC / Azure AD</text>

  <rect x="529" y="686" width="210" height="72" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="634" y="710" font-size="13" font-weight="bold" fill="#712B13" text-anchor="middle">Notifications</text>
  <text x="634" y="728" font-size="11" fill="#993C1D" text-anchor="middle">Email / Teams alert</text>
  <text x="634" y="744" font-size="11" fill="#993C1D" text-anchor="middle">Caregiver output</text>

  <!-- ══ Legend ══ -->
  <rect x="60" y="808" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="78" y="819" font-size="11" fill="#5F5E5A">Sensor layer</text>

  <rect x="172" y="808" width="12" height="12" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="819" font-size="11" fill="#5F5E5A">Embedded</text>

  <rect x="272" y="808" width="12" height="12" rx="2" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="290" y="819" font-size="11" fill="#5F5E5A">Security</text>

  <rect x="364" y="808" width="12" height="12" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="382" y="819" font-size="11" fill="#5F5E5A">Cloud</text>

  <rect x="436" y="808" width="12" height="12" rx="2" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text x="454" y="819" font-size="11" fill="#5F5E5A">Application</text>

  <!-- Caption -->
  <text x="400" y="858" font-size="11" fill="#888780" text-anchor="middle">Figure 1 — Cloud-based secure assistive monitoring system: high-level architecture</text>

</svg>
